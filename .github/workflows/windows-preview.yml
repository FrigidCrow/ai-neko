name: Test and Windows preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  PYTHONUTF8: '1'

jobs:
  test:
    name: Synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install locked desktop dependencies
        run: npm --prefix desktop ci --no-fund --no-audit
      - name: Fetch pinned Cubism Core for the complete application
        run: node desktop/vendor/fetch-core.cjs
      - name: Desktop host unit tests
        run: npm --prefix desktop test
      - name: Install locked Python from uv managed distributions
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src tests scripts packaging
      - name: Check format
        run: uv run --locked ruff format --check src tests scripts packaging
      - name: Run synthetic acceptance and save redacted evidence
        run: uv run --locked python scripts/m0_smoke.py --output artifacts/m0/${{ runner.os }}-smoke.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ runner.os }}
          path: artifacts/m0/*.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build and exercise Windows ZIP
    needs: test
    runs-on: windows-2022
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install locked desktop dependencies
        run: npm --prefix desktop ci --no-fund --no-audit
      - name: Fetch pinned Cubism Core for the complete application
        run: node desktop/vendor/fetch-core.cjs
      - name: Desktop host unit tests
        run: npm --prefix desktop test
      - name: Install locked Python from uv managed distributions
        run: uv python install
      - name: Choose immutable build version
        id: version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          base = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["GITHUB_REF"]
          value = ref.removeprefix("refs/tags/v") if ref.startswith("refs/tags/") else f"{base}-dev.{os.environ['GITHUB_SHA'][:12]}"
          if not re.fullmatch(re.escape(base) + r"(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?", value):
              raise SystemExit("Tag must be v<project version> with an optional prerelease suffix")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"value={value}\n")
      - name: Install locked build dependencies
        run: uv sync --locked --no-dev --group build
      - name: Ensure the locked Electron distribution is installed
        run: node -p "require('./desktop/node_modules/electron')"
      - name: Build self-contained Windows package
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --no-dev --group build python scripts/build_windows.py --version "$env:PREVIEW_VERSION" --output artifacts/package
      - name: Exercise extracted executable
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --no-dev --group build python scripts/package_smoke.py --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/package-smoke.json
      - name: Exercise actual desktop catgirl and streaming chat
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/desktop_smoke.cjs --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/desktop-smoke.json
      - name: Exercise packaged persona memory vision and voice loop
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: node desktop/tests/companion.smoke.cjs --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/companion-smoke.json
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence
          path: |
            artifacts/package/*.json
            artifacts/package/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-neko-windows-x64
          path: |
            artifacts/package/*.zip
            artifacts/package/*.json
            artifacts/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged desktop catgirl preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-neko-windows-x64
          path: release
      - name: Download synthetic evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: release
          merge-multiple: true
      - name: Download desktop screenshots and package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-evidence
          path: release
      - name: Verify package hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Write explicit preview scope
        env:
          PREVIEW_VERSION: ${{ needs.package.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 五项能力猫娘桌宠预览

          下载 `ai-neko-…-windows-x64.zip` 后解压到独立目录，阅读包内 README，双击 `ai-neko.exe`。包内包含 Electron、Python、猫娘与运行依赖，无需安装 Python、Node 或 uv。首次使用请阅读 Live2D 条款并选择是否接受。

          本版提供可见猫娘桌宠、流式文字聊天、可编辑人格、明确选源后每次提问截图、按键语音输入与按句朗读，以及共享 Tavily 搜索和网页正文/来源。长期记忆本地保存，支持查看依据、纠正、遗忘与快照恢复；自动整理对话需显式开启。猫娘使用参考 N.E.K.O 的默认 YUI Lolita，来源与许可随包提供。请配置自己的模型、搜索和语音服务，调用按相应服务商计费；观察画面需要支持图片的模型。**不含免按键语音唤醒、多角色导入或键鼠控制。**

          首次试用：在猫娘设置中保存人格和模型配置；需要看图时选择游戏窗口并启用观察；配置ASR/TTS并勾选“朗读回复”后点击“说话”，说完再次点击，猫娘将按句朗读回复。默认按需联网，搜索凭据由兼容模型共用；没有搜索Key仍可普通聊天。

          本轮补齐记忆快照确认恢复/删除与已完整听完句子的后续上下文，修复快速录音、旧识别结果、截图重试和关闭观察的竞态。截图只在当轮内存使用；关闭观察取消相关视觉请求，超过120秒的截图停止继续使用。已有v0.3.0-alpha.1及更早版本保留。

          本版本在 GitHub Windows Server 2022 x64 runner 构建，并用解压后的 exe 实际验证启动、鉴权、退出、图恢复以及人格/记忆/视觉/语音合成闭环。Windows 11 x64 用户真机验收仍待完成；尚未签名。

          `build-info.json` 记录源码 commit、锁文件、依赖和构建环境，`SHA256SUMS.txt` 可核对 ZIP；`package-smoke.json`、`desktop-smoke.json`、`companion-smoke.json` 与各平台 smoke 报告为合成验证证据。CI 使用本地合成模型、画面和音频服务，真实云模型/搜索/语音质量未包含在这些合成报告中；未提供真实凭据时真实测试数为 0。Windows 11 真机和真实攻略质量仍需单独验收。旧版本保留，可按版本下载，不自动迁移数据。
          NOTES
          printf '\nSource: `%s`\nWorkflow: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
      - name: Create new prerelease (never overwrite an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release. Create a new version instead.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "ai-neko $RELEASE_TAG — 人格、视觉、语音与长期记忆预览" --notes-file release-notes.md
