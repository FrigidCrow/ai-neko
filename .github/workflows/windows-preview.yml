name: Test and Windows preview

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_voice:
        description: 'Explicitly install/download and exercise the existing real voice runtime'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  PYTHONUTF8: '1'

jobs:
  test:
    name: Synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install locked desktop dependencies
        run: npm --prefix desktop ci --no-fund --no-audit
      - name: Fetch pinned Cubism Core for the complete application
        run: node desktop/vendor/fetch-core.cjs
      - name: Desktop host unit tests
        run: npm --prefix desktop test
      - name: Install locked Python from uv managed distributions
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify native voice imports with the owner stdin pipe kept open
        if: ${{ runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.run_real_voice == true }}
        timeout-minutes: 5
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}\ai-neko-voice-import-中文 空格-${{ github.run_id }}-${{ github.run_attempt }}\venv
          UV_CACHE_DIR: ${{ runner.temp }}\ai-neko-voice-import-中文 空格-${{ github.run_id }}-${{ github.run_attempt }}\cache
        run: |
          uv --no-config sync --project src/ai_neko/media/local_runtime --locked --no-build --no-sources --no-install-project --python 3.11.15 --no-python-downloads --default-index https://pypi.org/simple --link-mode copy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe scripts/voice_import_smoke.py --venv "$env:UV_PROJECT_ENVIRONMENT" --output artifacts/mvp2/Windows-voice-import-smoke.json
          exit $LASTEXITCODE
      - name: Record paused native voice validation
        if: ${{ runner.os == 'Windows' && !(github.event_name == 'workflow_dispatch' && inputs.run_real_voice == true) }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = {
              "schema_version": 1,
              "status": "SKIPPED_PAUSED",
              "scope": "native_voice_import",
              "reason": "Real voice validation is paused; requires explicit workflow_dispatch run_real_voice=true.",
              "executed": False,
              "source_commit": os.environ["GITHUB_SHA"],
              "voice_runtime_downloads": 0,
              "voice_model_downloads": 0,
              "real_voice_calls": 0,
              "user_microphone_reads": 0,
          }
          output = Path("artifacts/mvp2/Windows-voice-import-smoke.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
      - name: Lint
        run: uv run --locked ruff check src tests scripts packaging
      - name: Check format
        run: uv run --locked ruff format --check src tests scripts packaging
      - name: Diagnose synthetic Windows compatibility regressions
        if: runner.os == 'Windows'
        run: uv run --locked pytest tests/test_local_voice.py tests/test_voice_local_integration.py tests/test_free_voice_smoke.py tests/test_guides_integrated.py tests/test_search_cache.py tests/test_v04_upgrade.py -q --tb=short --no-header
      - name: Verify frozen guide retrieval and injection corpus
        run: uv run --locked python scripts/evaluate_guides.py --output artifacts/mvp2/${{ runner.os }}-guide-evaluation.json
      - name: Measure production guide retrieval with 200 synthetic documents
        run: uv run --locked python scripts/benchmark_guides.py --output artifacts/mvp2/${{ runner.os }}-guide-benchmark.json
      - name: Run synthetic acceptance and save redacted evidence
        run: uv run --locked python scripts/m0_smoke.py --output artifacts/m0/${{ runner.os }}-smoke.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ runner.os }}
          path: |
            artifacts/m0/*.json
            artifacts/mvp2/*.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build and exercise Windows ZIP
    needs: test
    runs-on: windows-2022
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install locked desktop dependencies
        run: npm --prefix desktop ci --no-fund --no-audit
      - name: Fetch pinned Cubism Core for the complete application
        run: node desktop/vendor/fetch-core.cjs
      - name: Desktop host unit tests
        run: npm --prefix desktop test
      - name: Install locked Python from uv managed distributions
        run: uv python install
      - name: Choose immutable build version
        id: version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          base = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["GITHUB_REF"]
          value = ref.removeprefix("refs/tags/v") if ref.startswith("refs/tags/") else f"{base}-dev.{os.environ['GITHUB_SHA'][:12]}"
          if not re.fullmatch(re.escape(base) + r"(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?", value):
              raise SystemExit("Tag must be v<project version> with an optional prerelease suffix")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"value={value}\n")
      - name: Install locked build dependencies
        run: uv sync --locked --no-dev --group build
      - name: Ensure the locked Electron distribution is installed
        run: node -p "require('./desktop/node_modules/electron')"
      - name: Build self-contained Windows package
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --no-dev --group build python scripts/build_windows.py --version "$env:PREVIEW_VERSION" --output artifacts/package
      - name: Exercise extracted executable
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --no-dev --group build python scripts/package_smoke.py --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/package-smoke.json
      - name: Exercise actual desktop catgirl and streaming chat
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/desktop_smoke.cjs --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/desktop-smoke.json
      - name: Exercise packaged persona memory vision and voice loop
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: node desktop/tests/companion.smoke.cjs --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/companion-smoke.json
      - name: Exercise packaged guide persistence and continuous match context
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: node desktop/tests/g6-acceptance.smoke.cjs --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/g6-acceptance.json
      - name: Install and exercise real free voice through the packaged backend
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_voice == true }}
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --no-dev --group build python scripts/free_voice_smoke.py --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/free-voice-smoke.json
      - name: Record paused packaged real voice validation
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_real_voice == true) }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = {
              "schema_version": 1,
              "status": "SKIPPED_PAUSED",
              "scope": "packaged_real_voice",
              "reason": "Real voice validation is paused; requires explicit workflow_dispatch run_real_voice=true.",
              "executed": False,
              "source_commit": os.environ["GITHUB_SHA"],
              "voice_runtime_downloads": 0,
              "voice_model_downloads": 0,
              "real_voice_calls": 0,
              "user_microphone_reads": 0,
          }
          output = Path("artifacts/package/free-voice-smoke.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence
          path: |
            artifacts/package/*.json
            artifacts/package/*.png
            artifacts/package/*.wav
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-neko-windows-x64
          path: |
            artifacts/package/*.zip
            artifacts/package/*.json
            artifacts/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged desktop catgirl preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-neko-windows-x64
          path: release
      - name: Download synthetic evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: release
          merge-multiple: true
      - name: Download desktop screenshots and package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-evidence
          path: release
      - name: Verify package hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Require approved versioned release notes
        env:
          PREVIEW_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/v${PREVIEW_VERSION}.md"
          test -f "$notes"
          if ! grep -Fxq '<!-- release-readiness: ready -->' "$notes"; then
            echo 'Release notes are not approved for publication; complete candidate functional acceptance first.' >&2
            exit 1
          fi
          cp "$notes" release-notes.md
          printf '\nSource: `%s`\nWorkflow: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
      - name: Create new prerelease (never overwrite an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release. Create a new version instead.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "ai-neko $RELEASE_TAG — Windows 非语音功能与可靠性预览" --notes-file release-notes.md
