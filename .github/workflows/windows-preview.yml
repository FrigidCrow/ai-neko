name: Test and Windows preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  PYTHONUTF8: '1'

jobs:
  test:
    name: Synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: false
      - name: Install locked Python from uv managed distributions
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src tests scripts packaging
      - name: Check format
        run: uv run --locked ruff format --check src tests scripts packaging
      - name: Run synthetic acceptance and save redacted evidence
        run: uv run --locked python scripts/m0_smoke.py --output artifacts/m0/${{ runner.os }}-smoke.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ runner.os }}
          path: artifacts/m0/*.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build and exercise Windows ZIP
    needs: test
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: false
      - name: Install locked Python from uv managed distributions
        run: uv python install
      - name: Choose immutable build version
        id: version
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path
          base = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["GITHUB_REF"]
          value = ref.removeprefix("refs/tags/v") if ref.startswith("refs/tags/") else f"{base}-dev.{os.environ['GITHUB_SHA'][:12]}"
          if not re.fullmatch(re.escape(base) + r"(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?", value):
              raise SystemExit("Tag must be v<project version> with an optional prerelease suffix")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"value={value}\n")
      - name: Install locked build dependencies
        run: uv sync --locked --group build
      - name: Build self-contained Windows package
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --group build python scripts/build_windows.py --version "$env:PREVIEW_VERSION" --output artifacts/package
      - name: Exercise extracted executable
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: uv run --locked --group build python scripts/package_smoke.py --archive "artifacts/package/ai-neko-$env:PREVIEW_VERSION-windows-x64.zip" --output artifacts/package/package-smoke.json
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence
          path: artifacts/package/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-neko-windows-x64
          path: |
            artifacts/package/*.zip
            artifacts/package/*.json
            artifacts/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged foundation preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-neko-windows-x64
          path: release
      - name: Download synthetic evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: release
          merge-multiple: true
      - name: Verify package hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Write explicit preview scope
        env:
          PREVIEW_VERSION: ${{ needs.package.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## M0 基础验证版 / Foundation preview

          下载 `ai-neko-…-windows-x64.zip` 后解压到独立目录，阅读包内 README，运行 `Check foundation.cmd`。已自带 Python 和运行依赖，无需安装 Python、Node 或 uv。

          当前仅提供本机服务、独立数据目录、鉴权和合成 LangGraph 恢复诊断。**没有文字聊天页面、真实模型、联网查攻略、长期记忆、桌宠或语音。** M1 将提供文字聊天和带来源的攻略查询。

          本版本在 GitHub Windows Server 2022 x64 runner 构建，并用解压后的 exe 实际验证启动、鉴权、退出和图恢复。Windows 11 x64 用户真机验收仍待完成；尚未签名。

          `build-info.json` 记录源码 commit、锁文件、依赖和构建环境，`SHA256SUMS.txt` 可核对 ZIP；`package-smoke.json` 与各平台 smoke 报告为合成验证证据。真实模型测试数为 0。旧版本保留，可按版本下载，不自动迁移数据。
          NOTES
          printf '\nSource: `%s`\nWorkflow: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
      - name: Create new prerelease (never overwrite an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release. Create a new version instead.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "ai-neko $RELEASE_TAG — M0 基础验证版" --notes-file release-notes.md
