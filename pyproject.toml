[project]
name = "ai-neko"
version = "0.4.0"
description = "Independent desktop catgirl companion with local chat and guide search"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "websockets==16.1.1",
  "filelock==3.32.7",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
  "httpx==0.28.1",
]

[project.scripts]
ai-neko = "ai_neko.__main__:main"

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
build = ["pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_neko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
